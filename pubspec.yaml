name: iot_manager
description: IoT Manager - A Flutter application for managing IoT devices and MQTT connections.

publish_to: 'none'

version: 0.1.0-alpha+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & DI
  get_it: ^7.6.0
  
  # Database & Local Storage
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # Networking & MQTT
  http: ^1.1.0
  mqtt5_client: ^4.3.0
  connectivity_plus: ^5.0.0
  
  # JSON Serialization
  json_serializable: ^6.7.0
  json_annotation: ^4.8.1
  
  # EventBus
  event_bus: ^2.0.0
  
  # UI & Material
  cupertino_icons: ^1.0.0
  
  # Date & Time
  intl: ^0.19.0
  
  # Logging
  logger: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Linting
  flutter_lints: ^3.0.0
  
  # Testing
  mockito: ^5.4.0
  
  # Code Generation
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/
  
  # Fonts
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
